services:
  ignis:
    image: nobbe/ignis:latest
    container_name: obsidian-web
    ports:
      - 8080:8080
    environment:
      # match these to your host user (run: id)
      - PUID=1000
      - PGID=1000
    volumes:
      - ./vaults:/vaults
      - ./data:/app/data
      - ./app:/app/obsidian-app
    restart: unless-stopped
    networks:
      - all-connection
networks:
  all-connection:
    external: true
