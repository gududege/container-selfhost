services:
  memos:
    container_name: memos
    image: neosmemo/memos:latest
    hostname: memos
    volumes:
      - ${ENV_DIR_DATA:-./data}:/var/opt/memos
    ports:
      - 5230:5230
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - all-connection
networks:
  all-connection:
    external: true