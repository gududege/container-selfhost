services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://example.com
    volumes:
      - ./data/:/data/
    ports:
      - 6080:80
    networks:
      - all-connection
networks:
  all-connection:
    external: true
