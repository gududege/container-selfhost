services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2}
    devices:
      - /dev/dri:/dev/dri
    networks:
      - default
      - all-connection
    extends:
      file: hwaccel.transcoding.yml
      service: quicksync # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION:-./upload}:/usr/src/app/upload
      - ${USER_PHOTOS_LOCATION:-./photos}:/photos/jay
    user: 0:0
    environment:
      TZ: ${TZ:-Asia/Shanghai} # 时区, 默认 Asia/Shanghai
      IMMICH_LOG_LEVEL: ${IMMICH_LOG_LEVEL:-log} # 日志级别 (verbose, debug, log, warn, error), 默认 log
      # --- Database 环境变量 ---
      DB_HOSTNAME: ${DB_HOSTNAME:-immich-postgres} # Database host, 默认 database 
      DB_PORT: ${DB_PORT:-5432} # Database port, 默认 543  
      DB_USERNAME: ${DB_USERNAME:-postgres} # Database user, 默认 postgres 
      DB_PASSWORD: ${DB_PASSWORD:-postgres} # Database password, 默认 postgres 
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich} # Database name, 默认 immich 
      #DB_SSL_MODE: ${DB_SSL_MODE:-""} # Database SSL 模式
      DB_SKIP_MIGRATIONS: ${DB_SKIP_MIGRATIONS:-false} # 是否跳过 migrations, 默认 false 
      DB_STORAGE_TYPE: ${DB_STORAGE_TYPE:-SSD} # 存储类型 (SSD/HDD)，默认 SS  
      # --- Redis 环境变量 ---
      REDIS_HOSTNAME: ${REDIS_HOSTNAME:-immich-redis} # Redis host, 默认 redis 
      REDIS_PORT: ${REDIS_PORT:-6379} # Redis 端口, 默认 6379}  
      #REDIS_USERNAME: ${REDIS_USERNAME:-""} # Redis 用户名, 默认空 (未设置)
      #REDIS_PASSWORD: ${REDIS_PASSWORD:-""} # Redis 密码, 默认空 (未设置) 
      REDIS_DBINDEX: ${REDIS_DBINDEX:-0} # Redis DB 索引, 默认 0
    ports:
      - 2283:2283
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2048M
    healthcheck:
      disable: false
  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2}-openvino
    networks:
      - default
    extends:
      # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
      file: hwaccel.ml.yml
      service: openvino # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - ${MODEL_CACHE_LOCATION:-./model}:/cache
    environment:
      TZ: ${TZ:-Asia/Shanghai} # 时区, 默认 Asia/Shanghai
      IMMICH_LOG_LEVEL: ${IMMICH_LOG_LEVEL:-log} # 日志级别 (verbose, debug, log, warn, error), 默认 log
    restart: unless-stopped
    healthcheck:
      disable: false
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4096M
  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:8@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
    networks:
      - default
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
  immich-postgres:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    networks:
      - default
    user: 0:0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION:-./postgres}:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready --dbname='${DB_DATABASE_NAME}' --username='${DB_USERNAME}' ||
        exit 1; Chksum="$$(psql --dbname='${DB_DATABASE_NAME}'
        --username='${DB_USERNAME}' --tuples-only --no-align --command='SELECT
        COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo
        "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    shm_size: 128mb
    restart: unless-stopped
networks:
  all-connection:
    external: true
