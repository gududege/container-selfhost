services:
  openlist:
    image: openlistteam/openlist:latest-aio
    container_name: openlist
    volumes:
      - ${ENV_DIR_DATA:-./data}:/opt/openlist/data
      - ${ENV_DIR_MNT:-./user/data}:/mnt/data
    ports:
      - 5244:5244 # web
      - 5246:5246 # s3
    user: 0:0
    environment:
      - UMASK=022
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - all-connection
networks:
  all-connection:
    external: true
