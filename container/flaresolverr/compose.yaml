services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=Asia/Shanghai
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      - all-connection
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M
networks:
  all-connection:
    external: true
