services:
  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:latest
    hostname: uptime-kuma
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 6002:3001
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - all-connection
networks:
  all-connection:
    external: true