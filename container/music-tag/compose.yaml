services:
  music-tag:
    image: xhongc/music_tag_web:latest
    container_name: music-tag-web
    ports:
      - 8002:8002
    volumes:
      - ${ENV_DIR_MEDIA:-./media}:/app/media:rw
      - ./data:/app/data
    networks:
      - all-connection
    restart: unless-stopped
networks:
  all-connection:
    external: true
